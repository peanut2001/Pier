name: Relay image

# Builds the Pier Relay container (apps/relay) and publishes it to GHCR:
#   ghcr.io/<owner>/pier-relay:latest      every push to main that touches the relay
#   ghcr.io/<owner>/pier-relay:sha-<sha>   the same, pinned to the commit
#   ghcr.io/<owner>/pier-relay:<version>   release tags (v1.2.3 → 1.2.3)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - apps/relay/**
      - packages/crypto/**
      - bun.lock
      - .github/workflows/relay-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build · push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pier-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
