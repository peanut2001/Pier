<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob: https:; font-src data: https:; media-src data: blob: https:; base-uri 'none'; form-action 'none'"
		/>
		<title>HTML 预览</title>
	</head>
	<body>
		<script>
			function renderPreview(event) {
				if (event.source !== parent || event.data?.type !== "pier:html-preview" || typeof event.data.html !== "string") {
					return;
				}
				window.removeEventListener("message", renderPreview);
				document.open();
				document.write(event.data.html);
				document.close();
			}
			window.addEventListener("message", renderPreview);
		</script>
	</body>
</html>
